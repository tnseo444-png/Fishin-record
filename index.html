<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>분당조사 조과 관리 - 로그인</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="description" content="분당조사 낚시 기록 관리 - 개인별 로그인" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-slate-800 rounded-xl p-8 shadow-lg shadow-slate-950/50">
      <h1 class="text-3xl font-bold mb-2 text-center">분당조사</h1>
      <p class="text-slate-400 text-center mb-8">조과 관리자</p>

      <div class="space-y-3">
        <button class="user-btn w-full py-4 px-6 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 rounded-lg font-semibold text-lg transition transform hover:scale-105" data-user="윤선진">
          윤선진
        </button>
        <button class="user-btn w-full py-4 px-6 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-500 hover:to-green-600 rounded-lg font-semibold text-lg transition transform hover:scale-105" data-user="홍석진">
          홍석진
        </button>
        <button class="user-btn w-full py-4 px-6 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 rounded-lg font-semibold text-lg transition transform hover:scale-105" data-user="차인호">
          차인호
        </button>
        <button class="user-btn w-full py-4 px-6 bg-gradient-to-r from-orange-600 to-orange-700 hover:from-orange-500 hover:to-orange-600 rounded-lg font-semibold text-lg transition transform hover:scale-105" data-user="김진욱">
          김진욱
        </button>
      </div>

      <p class="text-slate-500 text-sm text-center mt-8">
        선택한 사용자의 개인 기록이 보호되며, 브라우저에 저장됩니다.
      </p>
    </div>
  </div>

  <script>
    document.querySelectorAll('.user-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const username = this.getAttribute('data-user');
        localStorage.setItem('currentUser', username);
        window.location.href = 'app.html';
      });
    });

    // 이미 로그인된 사용자가 있으면 app.html로 바로 이동
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser) {
      window.location.href = 'app.html';
    }
  </script>
</body>
</html>
